name: Delete approved ROI+ purchase history for one race date
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact reviewed source commit SHA (must equal this workflow commit)
        required: true
        type: string
      target_date:
        description: Exact race date; only 2026-10-13 is supported
        required: true
        type: string
      confirmation:
        description: Type DELETE PURCHASE HISTORY FOR 2026-10-13 ONLY
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: roi-plus-production-deploy
  cancel-in-progress: false
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPROVED_SOURCE_SHA: ${{ inputs.approved_sha }}
      DELETE_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PURCHASE_HISTORY_BACKUP_DIR: ${{ runner.temp }}/roi-plus-purchase-history-backup
    steps:
      - name: Validate exact source and target
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          test "$APPROVED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$TARGET_DATE" = "2026-10-13"
          test "$DELETE_CONFIRMATION" = "DELETE PURCHASE HISTORY FOR 2026-10-13 ONLY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned workspace dependencies
        run: npm ci
      - name: Validate scoped operator and synthetic SQLite safeguards
        run: node --test scripts/delete-purchase-history-date.test.mjs
      - name: Capture scoped rows, balances, decision guards, trigger source and hashes
        run: node scripts/delete-purchase-history-date.mjs --backup
      - name: Upload recoverable purchase history restore point before deletion
        uses: actions/upload-artifact@v4
        with:
          name: roi-plus-purchase-history-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/roi-plus-purchase-history-backup/purchase-history-2026-10-13.json
          if-no-files-found: error
          retention-days: 30
      - name: Atomically delete only backed-up 2026-10-13 purchase rows
        run: node scripts/delete-purchase-history-date.mjs --delete
      - name: Upload deletion verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roi-plus-purchase-history-delete-report-${{ github.run_id }}
          path: ${{ runner.temp }}/roi-plus-purchase-history-backup/delete-report.json
          if-no-files-found: ignore
          retention-days: 30
