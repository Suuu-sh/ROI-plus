name: Diagnose paper cron (read-only)

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Tail capture window'
        required: true
        type: choice
        options: ['120', '240']
        default: '120'

permissions:
  contents: read

jobs:
  tail-paper-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler dependencies
        run: npm ci
      - name: Verify sanitizer against synthetic tail fixtures
        run: node --test scripts/diagnose-paper-cron.test.mjs
      - name: Capture Worker tail and bounded remote SELECT context
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAIL_DURATION_SECONDS: ${{ inputs.duration_seconds }}
        run: node ../../scripts/diagnose-paper-cron.mjs > ../../paper-cron-diagnostic.json
      - name: Upload sanitized diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: paper-cron-diagnostic
          path: paper-cron-diagnostic.json
          if-no-files-found: error
          retention-days: 1
