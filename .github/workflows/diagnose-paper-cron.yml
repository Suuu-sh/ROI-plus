name: Diagnose paper cron (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail-paper-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler dependencies
        run: npm ci
      - name: Verify sanitizer against synthetic tail fixtures
        run: node --test scripts/diagnose-paper-cron.test.mjs
      - name: Capture and sanitize Worker tail for 120 seconds
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../../scripts/diagnose-paper-cron.mjs > ../../paper-cron-diagnostic.json
      - name: Upload sanitized diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: paper-cron-diagnostic
          path: paper-cron-diagnostic.json
          if-no-files-found: error
          retention-days: 1
