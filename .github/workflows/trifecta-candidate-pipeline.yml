name: trifecta candidate pipeline
on:
  schedule:
    # 23:50 JST; process today's and yesterday's immutable archives.
    - cron: '50 14 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: First archive date (YYYY-MM-DD)
        required: false
      until:
        description: Last archive date (YYYY-MM-DD)
        required: false
permissions:
  contents: read
concurrency:
  group: boat-learning-state
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Set cache date
        id: cache-date
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore shared learning cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            daily-${{ runner.os }}-
      - name: Set bounded archive range
        id: dates
        env:
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: |
          if [[ -n "$INPUT_SINCE" || -n "$INPUT_UNTIL" ]]; then
            [[ -n "$INPUT_SINCE" && -n "$INPUT_UNTIL" ]] || { echo 'both dates are required' >&2; exit 2; }
            since="$INPUT_SINCE"; until="$INPUT_UNTIL"
          else
            since="$(TZ=Asia/Tokyo date -d yesterday +%F)"
            until="$(TZ=Asia/Tokyo date +%F)"
          fi
          python - "$since" "$until" "$GITHUB_OUTPUT" <<'PY'
          import datetime, re, sys
          start, end, output = sys.argv[1:]
          for value in (start, end):
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", value) or datetime.date.fromisoformat(value).isoformat() != value:
                  raise SystemExit("archive dates must be valid YYYY-MM-DD values")
          if datetime.date.fromisoformat(end) < datetime.date.fromisoformat(start):
              raise SystemExit("archive date range is reversed")
          if (datetime.date.fromisoformat(end) - datetime.date.fromisoformat(start)).days > 31:
              raise SystemExit("archive date range exceeds 32 days")
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"since={start}\nuntil={end}\n")
          PY
      - name: Clear prior-run trifecta reports
        run: rm -f ml/data/learning/trifecta-report.json ml/data/learning/trifecta-pipeline-summary.json
      - name: Import verified archives and train only if PIT data qualifies
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: https://roi-plus-api.suuu-sh.workers.dev
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          PIPELINE_SINCE: ${{ steps.dates.outputs.since }}
          PIPELINE_UNTIL: ${{ steps.dates.outputs.until }}
        run: python -m edgelab.trifecta_pipeline --since "$PIPELINE_SINCE" --until "$PIPELINE_UNTIL"
      - name: Upload coverage and training reports
        if: always() && hashFiles('ml/data/learning/trifecta-pipeline-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trifecta-pipeline-report-${{ github.run_id }}
          path: |
            ml/data/learning/trifecta-pipeline-summary.json
            ml/data/learning/trifecta-report.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Verify candidate bundle from this run
        id: bundle
        if: always() && !cancelled()
        env:
          PYTHONPATH: ml
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from edgelab.artifact_bundle import verify_candidate_model_bundle
          output = Path(os.environ['GITHUB_OUTPUT'])
          found = []
          for manifest_path in Path('ml/artifacts').glob('candidate-model-artifact-*.manifest.json'):
              try:
                  manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  continue
              provenance = manifest.get('provenance') or {}
              if provenance.get('artifactRunId') == os.environ['GITHUB_RUN_ID']:
                  found.append((manifest_path, manifest))
          if len(found) > 1:
              raise RuntimeError('multiple current-run candidate bundles are ambiguous')
          if not found:
              output.write_text('artifact_name=\nmodel_id=\nbundle_file=\nmanifest_file=\n', encoding='utf-8')
              print('No trifecta candidate artifact was produced.')
              raise SystemExit(0)
          manifest_path, manifest = found[0]
          model_id = manifest.get('modelId')
          bundle = Path('ml/artifacts') / str(manifest.get('bundleFile') or '')
          verified = verify_candidate_model_bundle(bundle, expected_model_id=model_id, manifest_path=manifest_path,
              loose_pickle_path=Path('ml/artifacts') / f'{model_id}.pkl',
              loose_metadata_path=Path('ml/artifacts') / f'{model_id}.json')
          provenance = verified.get('provenance') or {}
          if (provenance.get('artifactRunId') != os.environ['GITHUB_RUN_ID']
                  or str(provenance.get('artifactRunAttempt')) != os.environ['GITHUB_RUN_ATTEMPT']
                  or provenance.get('repository') != os.environ['GITHUB_REPOSITORY']
                  or provenance.get('commitSha') != os.environ['GITHUB_SHA']):
              raise RuntimeError('candidate bundle provenance mismatch')
          with output.open('a', encoding='utf-8') as stream:
              stream.write(f'artifact_name=candidate-model-artifact-{model_id}\n')
              stream.write(f'model_id={model_id}\n')
              stream.write(f'bundle_file={bundle.name}\n')
              stream.write(f'manifest_file={manifest_path.name}\n')
          PY
      - name: Archive verified candidate bundle
        if: always() && !cancelled() && steps.bundle.outputs.artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: |
            ml/artifacts/${{ steps.bundle.outputs.model_id }}.pkl
            ml/artifacts/${{ steps.bundle.outputs.model_id }}.json
            ml/artifacts/${{ steps.bundle.outputs.bundle_file }}
            ml/artifacts/${{ steps.bundle.outputs.manifest_file }}
          if-no-files-found: error
          retention-days: 90
