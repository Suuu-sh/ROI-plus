name: trifecta experimental forecast only
on:
  schedule:
    # GitHub limits each schedule expression to a five-minute cadence. Five
    # staggered expressions provide one invocation per minute during the
    # Japanese boat-racing day (10:00-23:59 JST / 01:00-14:59 UTC).
    - cron: '0-59/5 1-14 * * *'
    - cron: '1-59/5 1-14 * * *'
    - cron: '2-59/5 1-14 * * *'
    - cron: '3-59/5 1-14 * * *'
    - cron: '4-59/5 1-14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boat-experimental-forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install pinned ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Set cache date
        id: cache-date
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore shared B/K data and experimental model cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            daily-${{ runner.os }}-
      - name: Resolve exact registered model, validate cached bundle, refresh, and forecast
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: https://roi-plus-api.suuu-sh.workers.dev
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          EXPERIMENTAL_ARTIFACT_DIR: ml/artifacts
          EXPERIMENTAL_STORE_PATH: ml/data/rows.json
        run: python -m edgelab.experimental_forecast_job
