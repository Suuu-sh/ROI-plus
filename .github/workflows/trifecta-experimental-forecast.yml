name: trifecta experimental forecast only
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      market_window_only:
        description: 'Limit this run to the JST market window (used by the scheduled watchdog)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: boat-experimental-forecast
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      # Schedule events delayed beyond the JST market window are skipped before checkout/setup.
      - name: Skip scheduled runs outside the JST market window
        id: window
        shell: bash
        env:
          MARKET_WINDOW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.market_window_only }}
        run: |
          active=true
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' || "$MARKET_WINDOW_ONLY" == 'true' ]]; then
            hour=$(TZ=Asia/Tokyo date +%H)
            if (( 10#$hour < 8 || 10#$hour >= 23 )); then
              active=false
            fi
          fi
          printf 'active=%s\n' "$active" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
      - uses: actions/setup-python@v5
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install pinned ML dependencies
        if: steps.window.outputs.active == 'true'
        run: python -m pip install -r ml/requirements.txt
      - name: Set cache date
        if: steps.window.outputs.active == 'true'
        id: cache-date
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore shared B/K data and experimental model cache
        uses: actions/cache/restore@v4
        if: steps.window.outputs.active == 'true'
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            daily-${{ runner.os }}-
      - name: Bound scheduled loop to the JST market window
        id: duration
        if: steps.window.outputs.active == 'true'
        shell: bash
        env:
          MARKET_WINDOW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.market_window_only }}
        run: |
          minutes=300
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' || "$MARKET_WINDOW_ONLY" == 'true' ]]; then
            hour=$(TZ=Asia/Tokyo date +%H)
            minute=$(TZ=Asia/Tokyo date +%M)
            if (( 10#$hour < 8 || 10#$hour >= 23 )); then
              printf 'active=false\nminutes=0\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            remaining=$(( (23 - 10#$hour) * 60 - 10#$minute ))
            if (( remaining < 1 )); then
              printf 'active=false\nminutes=0\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if (( remaining < minutes )); then minutes=$remaining; fi
          fi
          printf 'active=true\nminutes=%s\n' "$minutes" >> "$GITHUB_OUTPUT"
      - name: Resolve exact registered model, validate cached bundle, refresh, and forecast
        if: steps.duration.outputs.active == 'true'
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: https://roi-plus-api.suuu-sh.workers.dev
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          EXPERIMENTAL_ARTIFACT_DIR: ml/artifacts
          EXPERIMENTAL_STORE_PATH: ml/data/rows.json
        run: python -u -m edgelab.experimental_forecast_job --duration-minutes "${{ steps.duration.outputs.minutes }}"
