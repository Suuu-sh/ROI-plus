name: recover corrected boat-win candidate
on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: 'Exact reviewed daily cache key; no restore-key fallback is allowed'
        required: true
        type: string
        default: daily-Linux-2026-10-10-38045849740
permissions:
  contents: read
  actions: read
concurrency:
  group: boat-learning-state
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Restore exact reviewed daily cache (raw files are the only training source)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: ${{ inputs.cache_key }}
      - name: Require exact cache hit and reviewed key
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ inputs.cache_key }}
        run: |
          set -euo pipefail
          test "$CACHE_KEY" = 'daily-Linux-2026-10-10-38045849740'
          test "$CACHE_HIT" = 'true' || { echo 'Exact recovery cache not found; refusing fallback.' >&2; exit 1; }
          test -d data/raw/boatrace || { echo 'Pinned cache contains no raw boat data.' >&2; exit 1; }
      - name: Train, register candidate only, and save registry-bound validation
        id: recovery
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: ${{ secrets.EDGELAB_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m edgelab.recovery_win \
            --cache-key '${{ inputs.cache_key }}' \
            --run-id '${{ github.run_id }}' \
            --raw data/raw/boatrace \
            --snapshot "ml/data/learning/recovery-clean-store-${{ github.run_id }}.json" \
            --artifact-dir ml/artifacts \
            --report "ml/data/learning/recovery-win-validation-${{ github.run_id }}.json"
      - name: Archive exact immutable candidate artifact pair
        if: always() && steps.recovery.outputs.candidate_id != '' && hashFiles(format('ml/artifacts/{0}.json', steps.recovery.outputs.candidate_id)) != '' && hashFiles(format('ml/artifacts/{0}.pkl', steps.recovery.outputs.candidate_id)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model-artifact-${{ steps.recovery.outputs.candidate_id }}
          path: |
            ml/artifacts/${{ steps.recovery.outputs.candidate_id }}.json
            ml/artifacts/${{ steps.recovery.outputs.candidate_id }}.pkl
          if-no-files-found: error
          retention-days: 90
      - name: Archive recovery validation report
        if: always() && hashFiles(format('ml/data/learning/recovery-win-validation-{0}.json', github.run_id)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: recovery-validation-${{ github.run_id }}
          path: ml/data/learning/recovery-win-validation-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 90
