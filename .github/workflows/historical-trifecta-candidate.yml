name: Historical trifecta rolling candidate

on:
  schedule:
    # Tuesday 00:20 JST; this only reads the private archive and builds an isolated candidate.
    - cron: '20 15 * * 1'
  workflow_dispatch:
    inputs:
      as_of:
        description: Exclusive JST as-of date (YYYY-MM-DD); defaults to today in JST
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: historical-trifecta-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Restore immutable candidate artifacts only
        uses: actions/cache@v4
        with:
          path: ml/artifacts/historical-trifecta
          key: historical-trifecta-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            historical-trifecta-${{ runner.os }}-
      - name: Read rolling three-month R2 archive and build a candidate only
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: https://roi-plus-api.suuu-sh.workers.dev
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          if [[ -n "$AS_OF" ]]; then
            python -m edgelab.historical_trifecta --as-of "$AS_OF" --cache-dir "$RUNNER_TEMP/historical-trifecta"
          else
            python -m edgelab.historical_trifecta --cache-dir "$RUNNER_TEMP/historical-trifecta"
          fi
      - name: Upload candidate evidence (never raw archive objects)
        if: always() && hashFiles('ml/data/learning/historical-trifecta-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: historical-trifecta-candidate-${{ github.run_id }}
          path: |
            ml/data/learning/historical-trifecta-report.json
            ${{ runner.temp }}/historical-trifecta/training-source-manifest.json
            ml/artifacts/historical-trifecta/*.json
            ml/artifacts/historical-trifecta/*.pkl
          if-no-files-found: ignore
          retention-days: 90
