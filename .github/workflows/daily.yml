name: daily boat pipeline
on:
  schedule:
    # D1 の日次上限は UTC 0時 = 9:00 JST にリセット。GitHub の定期実行は遅延・欠落があるため朝は3回試し、
    # その日の朝の処理が成功済みなら2回目以降はスキップする。
    - cron: '30 0 * * *' # 09:30 JST
    - cron: '0 2 * * *'  # 11:00 JST
    - cron: '0 4 * * *'  # 13:00 JST
    - cron: '30 14 * * *' # 23:30 JST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boat-learning-state
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler dependencies
        run: npm ci
      - name: Set cache date
        id: cache-date
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore daily data and model cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            daily-${{ runner.os }}-
      - name: Clear stale report
        run: rm -f ml/data/learning/report.json
      - name: Initialize backfill state
        run: |
          if [ ! -f ml/data/backfill_state.json ]; then
            mkdir -p ml/data
            cp ml/state/backfill_state.json ml/data/backfill_state.json
          fi
      - name: Bootstrap history on cache miss
        if: hashFiles('ml/data/rows.json') == ''
        env:
          PYTHONPATH: ml
        run: python -m edgelab backfill --from 2026-07-01 --to "$(TZ=Asia/Tokyo date -d yesterday +%F)"
      - name: Skip if this morning already succeeded
        id: guard
        run: |
          MARK="ml/data/daily_ok_$(TZ=Asia/Tokyo date +%F)"
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" -lt 20 ] && [ -f "$MARK" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run daily pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: ${{ secrets.EDGELAB_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m edgelab daily
      - name: Mark success
        if: success() && steps.guard.outputs.skip != 'true'
        run: touch "ml/data/daily_ok_$(TZ=Asia/Tokyo date +%F)"
      - name: Archive learning feedback report
        if: always() && hashFiles('ml/data/learning/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: learning-feedback-${{ github.run_id }}
          path: ml/data/learning/report.json
          if-no-files-found: ignore
