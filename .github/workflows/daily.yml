name: daily boat pipeline
run-name: daily boat pipeline (${{ github.event.schedule || github.event_name }})
on:
  schedule:
    # D1 の日次上限は UTC 0時 = 9:00 JST にリセット。朝のB/K同期を9:05に前倒しし、
    # GitHub の定期実行遅延・欠落に備えて9:30/11:00/13:00にも再試行する。
    - cron: '5 0 * * *' # 09:05 JST
    - cron: '30 0 * * *' # 09:30 JST
    - cron: '0 2 * * *'  # 11:00 JST
    - cron: '0 4 * * *'  # 13:00 JST
    - cron: '30 14 * * *' # 23:30 JST
    # This established scheduled workflow also dispatches the isolated
    # forecast workflow. Five staggered five-minute expressions cover each
    # minute of the Japanese boat-racing day (10:00-23:59 JST).
    - cron: '0-59/5 1-14 * * *'
    - cron: '1-59/5 1-14 * * *'
    - cron: '2-59/5 1-14 * * *'
    - cron: '3-59/5 1-14 * * *'
    - cron: '4-59/5 1-14 * * *'
  workflow_dispatch:
    inputs:
      validated_model_run_id:
        description: 'Run ID of the validated model artifact bundle (after explicit approval only)'
        required: false
        type: string
      validated_model_artifact_name:
        description: 'Exact artifact name from that run; defaults to the legacy reviewed bundle'
        required: false
        type: string
        default: candidate-model-artifact-boat-win-lgbm-20261010-ee79bc87
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'schedule' && (github.event.schedule == '0-59/5 1-14 * * *' || github.event.schedule == '1-59/5 1-14 * * *' || github.event.schedule == '2-59/5 1-14 * * *' || github.event.schedule == '3-59/5 1-14 * * *' || github.event.schedule == '4-59/5 1-14 * * *') && 'boat-experimental-forecast-trigger' || 'boat-learning-state' }}
  cancel-in-progress: false
jobs:
  forecast:
    if: >-
      github.event_name == 'schedule' &&
      (github.event.schedule == '0-59/5 1-14 * * *' ||
      github.event.schedule == '1-59/5 1-14 * * *' ||
      github.event.schedule == '2-59/5 1-14 * * *' ||
      github.event.schedule == '3-59/5 1-14 * * *' ||
      github.event.schedule == '4-59/5 1-14 * * *')
    uses: ./.github/workflows/trifecta-experimental-forecast.yml
    secrets: inherit
  daily:
    if: >-
      github.event_name != 'schedule' ||
      !(github.event.schedule == '0-59/5 1-14 * * *' ||
      github.event.schedule == '1-59/5 1-14 * * *' ||
      github.event.schedule == '2-59/5 1-14 * * *' ||
      github.event.schedule == '3-59/5 1-14 * * *' ||
      github.event.schedule == '4-59/5 1-14 * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler dependencies
        run: npm ci
      - name: Set cache date
        id: cache-date
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore daily data and model cache
        id: daily-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            daily-${{ runner.os }}-
      - name: Validate manual artifact inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          MODEL_RUN_ID: ${{ inputs.validated_model_run_id }}
          ARTIFACT_NAME: ${{ inputs.validated_model_artifact_name }}
        run: |
          set -euo pipefail
          LEGACY_NAME='candidate-model-artifact-boat-win-lgbm-20261010-ee79bc87'
          if [ -z "$MODEL_RUN_ID" ] && [ "$ARTIFACT_NAME" != "$LEGACY_NAME" ]; then
            echo 'A non-default artifact name requires an explicit validated_model_run_id.' >&2
            exit 1
          fi
      - name: Restore explicitly approved validated model artifact
        if: github.event_name == 'workflow_dispatch' && inputs.validated_model_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.validated_model_artifact_name }}
          run-id: ${{ inputs.validated_model_run_id }}
          github-token: ${{ github.token }}
          path: ml/artifacts
      - name: Clear stale report
        run: rm -f ml/data/learning/report.json
      - name: Bootstrap local history on cache miss (no D1 sync)
        if: hashFiles('ml/data/rows.json') == ''
        env:
          PYTHONPATH: ml
        run: python -m edgelab backfill --from 2026-07-01 --to "$(TZ=Asia/Tokyo date -d yesterday +%F)"
      - name: Migrate normalized cache to venue-safe v2 once
        env:
          PYTHONPATH: ml
        run: python -m edgelab migrate-boat-venue-cache --raw data/raw/boatrace --marker ml/data/boat-venue-v2.json
      - name: Skip if this morning already succeeded
        id: guard
        run: |
          MARK="ml/data/daily_ok_$(TZ=Asia/Tokyo date +%F)"
          HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$HOUR" -lt 20 ] && [ -f "$MARK" ]; then
            SKIP="$(PYTHONPATH=ml python -m edgelab.daily_marker "$MARK")"
            if [ "$SKIP" = 'true' ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo 'Previous daily marker is incomplete or predates readiness tracking; retrying.'
              rm -f "$MARK"
            fi
          fi
      # Current-model recovery only: this validated bundle expires 2027-01-08.
      # Registry metadata does not consistently link future active models to
      # an archived Actions artifact. The daily pipeline still selects its active model from the authenticated registry
      # and verifies the artifact SHA256 plus venue/training provenance before inference.
      - name: Restore pinned model artifact for scheduled recovery
        if: github.event_name == 'schedule' && steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: candidate-model-artifact-boat-win-lgbm-20261010-14b4a90a
          run-id: '38053091327'
          github-token: ${{ github.token }}
          path: ml/artifacts
      - name: Run daily pipeline
        id: daily_pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: https://roi-plus-api.suuu-sh.workers.dev
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/daily-report.json"
          python -m edgelab daily | tee "$REPORT"
          COLLECTION_SUCCESS="$(jq -r '.daily_collection_success | if type == "boolean" then tostring else empty end' "$REPORT")"
          FORECAST_READY="$(jq -r '.forecast_ready | if type == "boolean" then tostring else empty end' "$REPORT")"
          [[ "$COLLECTION_SUCCESS" == 'true' || "$COLLECTION_SUCCESS" == 'false' ]]
          [[ "$FORECAST_READY" == 'true' || "$FORECAST_READY" == 'false' ]]
          echo "daily_collection_success=$COLLECTION_SUCCESS" >> "$GITHUB_OUTPUT"
          echo "forecast_ready=$FORECAST_READY" >> "$GITHUB_OUTPUT"
      - name: Mark success
        if: >-
          success() && steps.guard.outputs.skip != 'true' &&
          (github.event_name != 'schedule' ||
          (steps.daily_pipeline.outputs.daily_collection_success == 'true' &&
          steps.daily_pipeline.outputs.forecast_ready == 'true'))
        run: |
          MARK="ml/data/daily_ok_$(TZ=Asia/Tokyo date +%F)"
          printf 'daily_collection_success=%s\nforecast_ready=%s\n' \
            '${{ steps.daily_pipeline.outputs.daily_collection_success }}' \
            '${{ steps.daily_pipeline.outputs.forecast_ready }}' > "$MARK"
      - name: Archive learning feedback report
        if: always() && hashFiles('ml/data/learning/report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: learning-feedback-${{ github.run_id }}
          path: ml/data/learning/report.json
          if-no-files-found: ignore

      # A partial daily run can still have a complete normalized source cache:
      # run_daily saves rows before the remote D1 ingest. Preserve it for the
      # next retry without creating or changing the daily success marker.
      - name: Save daily data and model cache
        if: always() && !cancelled() && hashFiles('ml/data/rows.json') != '' && hashFiles('ml/data/boat-venue-v2.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
