name: Deploy private Python learner
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roi-plus-private-learner-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - run: npm ci
      # Deployment only: daily learning is invoked by Cloudflare Cron, not Actions.
      - name: Deploy isolated learner after local size validation
        run: UV=uv python3 scripts/build-python-learner.py --deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
