name: Deploy ROI-plus Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'ml/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-workers.yml'
      - 'db/migrations/**'
      - 'scripts/check-d1-migrations-ready.mjs'
      - 'scripts/check-d1-migrations-ready.test.mjs'
      - 'scripts/build-python-learner.py'

permissions:
  contents: read

concurrency:
  group: roi-plus-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, verify schema, and deploy Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.3'
      - name: Install dependencies
        run: npm ci
      - name: Test migration readiness gate
        run: node --test scripts/check-d1-migrations-ready.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      # Build the bounded Python Worker payload before any production mutation.
      - name: Validate Python learner Worker bundle (dry run)
        run: UV=uv python3 scripts/build-python-learner.py --dry-run
      # Finish API and web builds before the first production mutation.
      - name: Validate API Worker bundle (dry run)
        run: npm -w apps/api run deploy -- --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build web Worker assets
        run: npm -w apps/web run build
      # This performs one bounded read-only SELECT. Missing or unknown ledger state fails closed.
      - name: Check remote D1 migration readiness
        run: node scripts/check-d1-migrations-ready.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Private learner deployment remains pending remote size validation.
      - name: Deploy API Worker
        run: npm -w apps/api run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify API health
        run: curl --fail --silent --show-error --max-time 15 --output /dev/null https://roi-plus-api.suuu-sh.workers.dev/api/health
      # Deploy the dist bundle built above without running a potentially failing second build.
      - name: Deploy prebuilt web Worker
        working-directory: apps/web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
