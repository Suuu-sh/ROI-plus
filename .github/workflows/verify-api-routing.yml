name: Verify ROI+ API routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-api-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical API Worker identity
        run: node scripts/verify-api-routing.mjs
