name: Verify one historical trifecta R2 race

on:
  workflow_dispatch:
    inputs:
      race_date:
        description: Exact JST race date (YYYY-MM-DD)
        required: true
        type: string
      race_id:
        description: Exact real race ID (boat-YYYYMMDD-venue-race)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-historical-trifecta-r2-${{ inputs.race_id }}
  cancel-in-progress: false

jobs:
  verify-one-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Verify the exact immutable R2 race and learner input
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: https://roi-plus-api.suuu-sh.workers.dev
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          RACE_DATE: ${{ inputs.race_date }}
          RACE_ID: ${{ inputs.race_id }}
        run: >-
          python -m edgelab.historical_trifecta_verify
          --date "$RACE_DATE"
          --race-id "$RACE_ID"
          --report ml/data/learning/historical-trifecta-race-verification.json
      - name: Save sanitized verification report only
        if: always() && hashFiles('ml/data/learning/historical-trifecta-race-verification.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: historical-trifecta-race-verification-${{ github.run_id }}
          path: ml/data/learning/historical-trifecta-race-verification.json
          if-no-files-found: error
          retention-days: 30
