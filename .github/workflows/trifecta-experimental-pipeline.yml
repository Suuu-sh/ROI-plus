name: trifecta experimental model pipeline
on:
  schedule:
    - cron: '0 4 * * *' # 13:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: Run normal training plus forecast, or diagnose a pinned registered model only
        required: true
        default: train_and_forecast
        type: choice
        options:
          - train_and_forecast
          - forecast_only
      model_id:
        description: Required only for forecast_only; exact registered experimental model ID
        required: false
        type: string
      artifact_sha256:
        description: Required only for forecast_only; expected SHA-256 of the registered pickle
        required: false
        type: string
      since:
        description: First day of PIT archives to import (defaults to 31 days ago in JST)
        required: false
      until:
        description: Last day of PIT archives to import (defaults to today in JST)
        required: false
permissions:
  contents: read
concurrency:
  group: boat-learning-state
  cancel-in-progress: false
jobs:
  experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install pinned ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Set cache date
        id: cache-date
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore shared daily B/K data and model cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            daily-${{ runner.os }}-
      - name: Validate bounded archive range
        id: dates
        if: inputs.mode != 'forecast_only'
        env:
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_UNTIL: ${{ inputs.until }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_SINCE" || -n "$INPUT_UNTIL" ]]; then
            [[ -n "$INPUT_SINCE" && -n "$INPUT_UNTIL" ]] || { echo 'both dates are required' >&2; exit 2; }
            since="$INPUT_SINCE"; until="$INPUT_UNTIL"
          else
            since="$(TZ=Asia/Tokyo date -d '31 days ago' +%F)"
            until="$(TZ=Asia/Tokyo date +%F)"
          fi
          python - "$since" "$until" "$GITHUB_OUTPUT" <<'PY'
          import datetime, re, sys
          start, end, output = sys.argv[1:]
          for value in (start, end):
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", value) or datetime.date.fromisoformat(value).isoformat() != value:
                  raise SystemExit("archive dates must be valid YYYY-MM-DD values")
          if datetime.date.fromisoformat(end) < datetime.date.fromisoformat(start):
              raise SystemExit("archive date range is reversed")
          if (datetime.date.fromisoformat(end) - datetime.date.fromisoformat(start)).days > 31:
              raise SystemExit("archive date range exceeds 32 days")
          with open(output, "a", encoding="utf-8") as stream:
              stream.write(f"since={start}\nuntil={end}\n")
          PY
      - name: Remove stale experiment reports
        if: inputs.mode != 'forecast_only'
        run: rm -f ml/data/learning/trifecta-experimental-report.json
      - name: Import verified archives and train isolated experimental model
        if: inputs.mode != 'forecast_only'
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: ${{ secrets.EDGELAB_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          EXPERIMENT_SINCE: ${{ steps.dates.outputs.since }}
          EXPERIMENT_UNTIL: ${{ steps.dates.outputs.until }}
        run: python -m edgelab.trifecta_experimental_pipeline --since "$EXPERIMENT_SINCE" --until "$EXPERIMENT_UNTIL"
      - name: Identify generated experimental artifacts
        id: model
        if: always() && !cancelled() && (inputs.mode == 'forecast_only' || hashFiles('ml/data/learning/trifecta-experimental-report.json') != '')
        env:
          PYTHONPATH: ml
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_MODEL_ID: ${{ inputs.model_id }}
          INPUT_ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          if os.environ.get('INPUT_MODE') == 'forecast_only':
              from edgelab.experimental_registry import (ForecastOnlyArtifactError,
                                                         validate_forecast_only_artifact)
              model_id = os.environ.get('INPUT_MODEL_ID', '')
              expected_sha = os.environ.get('INPUT_ARTIFACT_SHA256', '')
              try:
                  validate_forecast_only_artifact(model_id, expected_sha, artifact_dir='ml/artifacts')
              except ForecastOnlyArtifactError as exc:
                  raise SystemExit('Pinned forecast artifact rejected: ' + exc.failure_category)
          else:
              report = json.loads(Path('ml/data/learning/trifecta-experimental-report.json').read_text(encoding='utf-8'))
              training = report.get('training') or {}
              if training.get('status') not in {'completed_experimental_only', 'artifact_already_exists_for_cohort'}:
                  print('No experimental model artifact was produced; inspect the coverage report.')
                  raise SystemExit(0)
              model_id = training.get('modelId')
              if not isinstance(model_id, str) or not model_id.startswith('boat-trifecta-exp-noweather-'):
                  raise SystemExit('Experimental model identity is invalid.')
              files = [f'ml/artifacts/{model_id}.pkl', f'ml/artifacts/{model_id}.json',
                       f"ml/artifacts/experimental-trifecta-{model_id}.manifest.json"]
              if not all(Path(path).is_file() for path in files):
                  raise SystemExit('Experimental artifact bundle is incomplete.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'model_id={model_id}\n')
          PY
      - name: Archive experimental model and training evidence
        if: always() && !cancelled() && inputs.mode != 'forecast_only' && steps.model.outputs.model_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: experimental-trifecta-model-${{ steps.model.outputs.model_id }}
          path: |
            ml/artifacts/${{ steps.model.outputs.model_id }}.pkl
            ml/artifacts/${{ steps.model.outputs.model_id }}.json
            ml/artifacts/experimental-trifecta-${{ steps.model.outputs.model_id }}.manifest.json
            ml/data/learning/trifecta-experimental-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive experiment coverage report
        if: always() && !cancelled() && inputs.mode != 'forecast_only' && hashFiles('ml/data/learning/trifecta-experimental-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trifecta-experimental-report-${{ github.run_id }}
          path: ml/data/learning/trifecta-experimental-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Register only the hash-bound experimental model
        if: success() && inputs.mode != 'forecast_only' && steps.model.outputs.model_id != ''
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: ${{ secrets.EDGELAB_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        run: |
          python - <<'PY'
          import json, os
          from edgelab.experimental_registry import (ExperimentalModelRegistrationError,
                                                       register_experimental_model)
          model_id = os.environ['MODEL_ID']
          base = os.environ.get('EDGELAB_API_URL', '').rstrip('/')
          token = os.environ.get('INGEST_TOKEN', '')
          try:
              result = register_experimental_model(model_id, artifact_dir='ml/artifacts',
                                                   base_url=base, token=token)
          except ExperimentalModelRegistrationError as exc:
              raise SystemExit('experimental model registration failed: ' + exc.failure_category)
          if result.get('modelId') != model_id:
              raise SystemExit('experimental model registration response was invalid')
          print('Experimental model registered in the isolated experiment registry.')
          PY
      - name: Refresh current-day PIT archives immediately before forecast
        if: success() && steps.model.outputs.model_id != ''
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: ${{ secrets.EDGELAB_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          rm -f ml/data/learning/trifecta-experimental-forecast-input-refresh.json
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from edgelab.experimental_forecast_refresh import refresh_current_day_archives
          today = datetime.datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          report = refresh_current_day_archives(today,
              base_url=os.environ.get('EDGELAB_API_URL', ''),
              token=os.environ.get('INGEST_TOKEN', ''))
          path = Path('ml/data/learning/trifecta-experimental-forecast-input-refresh.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
                          encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY
      - name: Generate and submit only a current actual-time T-60 forecast
        if: success() && steps.model.outputs.model_id != ''
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: ${{ secrets.EDGELAB_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        run: |
          rm -f ml/data/learning/trifecta-experimental-forecast-status.json ml/data/learning/trifecta-experimental-forecast.json
          python - <<'PY'
          import datetime, json, os, subprocess, sys
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from edgelab.experimental_forecast_submit import submit_forecasts

          report_path = Path('ml/data/learning/trifecta-experimental-forecast-status.json')
          envelope_path = Path('ml/data/learning/trifecta-experimental-forecast.json')
          refresh_path = Path('ml/data/learning/trifecta-experimental-forecast-input-refresh.json')
          try:
              input_refresh = json.loads(refresh_path.read_text(encoding='utf-8'))
          except (OSError, ValueError):
              input_refresh = {'status': 'unavailable', 'reason': 'refresh_report_missing'}
          model_id = os.environ['MODEL_ID']
          today = datetime.datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          # Capture actual now immediately before inference. Never reconstruct T-60
          # from the race schedule or supply a stale run-start timestamp.
          as_of = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00', 'Z')
          command = [sys.executable, '-m', 'edgelab', 'predict-trifecta-experimental',
                     '--model-id', model_id, '--date', today, '--as-of', as_of,
                     '--output', str(envelope_path)]
          run = subprocess.run(command, capture_output=True, text=True, check=False)
          status = {'schema': 'trifecta-experimental-forecast-status-v1', 'modelId': model_id,
                    'asOf': as_of, 'status': 'generation_unavailable',
                    'reason': 'forecast_input_or_artifact_invalid', 'inputArchiveRefresh': input_refresh}
          envelope = None
          if run.returncode == 0:
              try:
                  envelope = json.loads(envelope_path.read_text(encoding='utf-8'))
              except (OSError, ValueError):
                  status['reason'] = 'forecast_envelope_unreadable'
          if isinstance(envelope, dict) and envelope.get('modelId') == model_id:
              races = envelope.get('races')
              if isinstance(races, list) and not races:
                  status.update({'status': 'no_eligible_cutoff_race',
                                 'reason': 'no_verified_actual_t60_forecast_available'})
              elif isinstance(races, list) and 1 <= len(races) <= 4:
                  status = {'schema': status['schema'], 'modelId': model_id, 'asOf': as_of,
                            'inputArchiveRefresh': input_refresh,
                            **submit_forecasts(envelope,
                              base_url=os.environ.get('EDGELAB_API_URL', ''),
                              token=os.environ.get('INGEST_TOKEN', ''))}
              else:
                  status.update({'status': 'generation_unavailable',
                                 'reason': 'forecast_race_count_invalid'})
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(json.dumps(status, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
                                 encoding='utf-8')
          print(json.dumps(status, ensure_ascii=False, sort_keys=True))
          if status['status'] in {'generation_unavailable', 'invalid_request',
                                  'submission_failed', 'partially_stored'}:
              raise SystemExit(1)
          PY
      - name: Archive experimental forecast status and generated envelope
        if: always() && !cancelled() && hashFiles('ml/data/learning/trifecta-experimental-forecast-status.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: experimental-trifecta-forecast-${{ github.run_id }}
          path: |
            ml/data/learning/trifecta-experimental-forecast-status.json
            ml/data/learning/trifecta-experimental-forecast.json
            ml/data/learning/trifecta-experimental-forecast-input-refresh.json
          if-no-files-found: warn
          retention-days: 90
      - name: Save shared learning cache
        if: always() && !cancelled() && hashFiles('ml/data/rows.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
