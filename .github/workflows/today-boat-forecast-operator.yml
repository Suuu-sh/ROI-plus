name: one-day approved boat baseline operator
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Run one fixed, explicitly confirmed stage; auto-bet is intentionally not available here'
        required: true
        type: choice
        options:
          - allowance
          - promote
          - forecast
          - odds
          - verify
      confirmed:
        description: 'Explicitly confirm the selected production operation for UTC 2026-10-11'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: boat-learning-state
  cancel-in-progress: false
jobs:
  operate:
    if: inputs.confirmed == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install pinned project dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Restore the exact previously approved model artifact pair
        if: inputs.stage == 'promote' || inputs.stage == 'forecast'
        uses: actions/download-artifact@v4
        with:
          name: candidate-model-artifact-boat-win-lgbm-20261010-14b4a90a
          run-id: '38053091327'
          github-token: ${{ github.token }}
          path: ml/artifacts
      - name: Perform only the selected fixed-allowlist operation
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: ${{ secrets.EDGELAB_API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          test '${{ inputs.confirmed }}' = 'true'
          python -m edgelab.today_operator "$STAGE" --artifact-dir ml/artifacts
