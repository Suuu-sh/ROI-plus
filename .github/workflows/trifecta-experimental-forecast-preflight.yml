name: trifecta experimental forecast preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: boat-experimental-forecast-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install pinned ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Set cache date
        id: cache-date
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore shared forecast model cache (read only)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: daily-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            daily-${{ runner.os }}-
      - name: Refresh saved archives and run no-submit forecast diagnostic
        env:
          PYTHONPATH: ml
          EDGELAB_API_URL: https://roi-plus-api.suuu-sh.workers.dev
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          EXPERIMENTAL_ARTIFACT_DIR: ml/artifacts
          EXPERIMENTAL_STORE_PATH: ml/data/rows.json
        run: set -o pipefail; python -u -m edgelab.experimental_forecast_preflight | tee preflight.json
      - name: Upload sanitized preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-preflight-result
          path: preflight.json
          if-no-files-found: ignore
          retention-days: 1
