name: validate initial boat baseline
on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: 'Exact daily cache key containing this candidate and its trained cohort'
        required: true
        type: string
        default: daily-Linux-2026-10-10-38042505956
      sync_validation:
        description: 'Attach eligible validation evidence to the registered candidate (authenticated registry only)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: boat-learning-state
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install ML dependencies
        run: python -m pip install -r ml/requirements.txt
      - name: Restore exact candidate cache
        id: candidate-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw/boatrace
            ml/data
            ml/artifacts
          key: ${{ inputs.cache_key }}
      - name: Require exact cache hit
        if: steps.candidate-cache.outputs.cache-hit != 'true'
        run: |
          echo 'The exact candidate cache was not found; no newer cache will be substituted.' >&2
          exit 1
      - name: Validate without retraining or collecting
        env:
          PYTHONPATH: ml
          GITHUB_RUN_ID: ${{ github.run_id }}
          EDGELAB_API_URL: ${{ inputs.sync_validation && secrets.EDGELAB_API_URL || '' }}
          INGEST_TOKEN: ${{ inputs.sync_validation && secrets.INGEST_TOKEN || '' }}
        run: |
          set -euo pipefail
          rm -f ml/data/learning/initial-baseline-report.json
          if [ '${{ inputs.sync_validation }}' = 'true' ]; then
            python -m edgelab validate-baseline --model-id boat-win-lgbm-20261010-ee79bc87 --output ml/data/learning/initial-baseline-report.json --sync-validation
          else
            python -m edgelab validate-baseline --model-id boat-win-lgbm-20261010-ee79bc87 --output ml/data/learning/initial-baseline-report.json
          fi
      - name: Archive validation report
        if: always() && hashFiles('ml/data/learning/initial-baseline-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: initial-baseline-report-${{ github.run_id }}
          path: ml/data/learning/initial-baseline-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Archive exact model artifact pair for manual recovery
        if: always() && hashFiles('ml/artifacts/boat-win-lgbm-20261010-ee79bc87.json') != '' && hashFiles('ml/artifacts/boat-win-lgbm-20261010-ee79bc87.pkl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model-artifact-boat-win-lgbm-20261010-ee79bc87
          path: |
            ml/artifacts/boat-win-lgbm-20261010-ee79bc87.json
            ml/artifacts/boat-win-lgbm-20261010-ee79bc87.pkl
          if-no-files-found: error
          retention-days: 90
